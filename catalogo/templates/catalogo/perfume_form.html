{% extends "base.html" %}
{% block title %}{{ accion }} perfume{% endblock %}
{% block content %}
<section class="form-panel">
<h2>{{ accion }} perfume</h2>
<p>Nombre, categoría, precio y formato son obligatorios.</p>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit">Guardar perfume</button>
        <a href="{% url 'lista_perfumes' %}">Cancelar</a>
    </div>
</form>
</section>
{% endblock %}
